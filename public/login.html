<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login · GoPay Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
  <script src="/admin/assets/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-intro" aria-labelledby="login-intro-title">
      <h1 id="login-intro-title">Gateway control.</h1>
      <p>Buat pembayaran uji, periksa sesi merchant, dan baca rekonsiliasi dari satu tempat.</p>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <form class="login-form" id="login-form" novalidate>
        <header>
          <p class="wordmark">GOPAY / OPS</p>
          <h2 id="login-title">Login admin</h2>
          <p>Gunakan kredensial dashboard yang tersimpan di server.</p>
        </header>

        <div class="field" id="email-field">
          <label for="email">Alamat email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" aria-describedby="email-help" aria-required="true" required>
          <p class="field-helper" id="email-help">Format: nama@domain.com</p>
        </div>

        <div class="field" id="password-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" aria-describedby="password-help" aria-required="true" required>
          <p class="field-helper" id="password-help">Password tidak pernah dikirim ke frontend kembali.</p>
        </div>

        <button class="button button--wide" id="login-button" type="submit">Login admin</button>
        <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
